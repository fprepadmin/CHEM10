<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="nucleusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- AI Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Rounded App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Glass Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Atom Orbital Ellipses -->
  <g transform="translate(256, 256)" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round">
    <!-- Horizontal Orbit -->
    <ellipse rx="175" ry="62" stroke-opacity="0.9" />

    <!-- Orbit 60 deg -->
    <ellipse rx="175" ry="62" transform="rotate(60)" stroke-opacity="0.9" />

    <!-- Orbit 120 deg -->
    <ellipse rx="175" ry="62" transform="rotate(120)" stroke-opacity="0.9" />
  </g>

  <!-- Orbital Electron Dots -->
  <!-- Top Right Electron -->
  <circle cx="370" cy="190" r="16" fill="#ffffff">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="370" cy="190" r="24" fill="#a5f3fc" opacity="0.4" />

  <!-- Left Electron -->
  <circle cx="115" cy="235" r="15" fill="#ffffff" />
  <circle cx="115" cy="235" r="22" fill="#a5f3fc" opacity="0.4" />

  <!-- Bottom Right Electron -->
  <circle cx="330" cy="380" r="15" fill="#ffffff" />
  <circle cx="330" cy="380" r="22" fill="#a5f3fc" opacity="0.4" />

  <!-- Atom Central Nucleus Glow -->
  <circle cx="256" cy="256" r="54" fill="url(#nucleusGlow)" />
  <circle cx="256" cy="256" r="28" fill="#ffffff" />
  <circle cx="256" cy="256" r="14" fill="#0891b2" />

  <!-- AI Sparkle Top Right Accent -->
  <path d="M400 70 Q400 110 360 110 Q400 110 400 150 Q400 110 440 110 Q400 110 400 70 Z" fill="url(#sparkleGrad)" filter="url(#shadow)" />
</svg>
